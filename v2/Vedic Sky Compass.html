const SI_GRID=[[12,1,2,3],[11,null,null,4],[10,null,null,5],[9,8,7,6]];

function GrahaChip({g,small,transit}){
  return(
    <span style={{
      display:'inline-flex',alignItems:'center',
      background:g.isLagna?'transparent':transit?g.color+'18':g.color+'22',
      color:g.isLagna?'var(--gold)':g.color,

      fontSize:small?9:10,fontFamily:'Space Mono',fontWeight:700,lineHeight:1.5,
      marginRight:2,marginBottom:1,opacity:transit?.8:1,
    }}>
      {g.id}{g.exalted?'*':g.debilitated?'°':''}
    </span>
  );
}

function SouthIndianChart({showTransits,transitOffset,highlightSign}){
  const S=s=>({
    border:'1px solid rgba(255,255,255,0.09)',padding:'5px 6px',
    display:'flex',flexDirection:'column',gap:2,
    background:s===8?'rgba(232,184,75,0.05)':s===highlightSign?'rgba(0,205,176,0.06)':'transparent',
    minHeight:64,position:'relative',
    transition:'background .3s',
  });

  // compute transit positions for current offset (degrees animate over time)
  const transitBySign={};
  if(showTransits){
    TRANSIT_GRAHAS.forEach(tg=>{
      const animDeg=(tg.deg+transitOffset*tg.speed*0.1)%360;
      const signNum=((Math.floor(animDeg/30))%12)+1;
      if(!transitBySign[signNum])transitBySign[signNum]=[];
      transitBySign[signNum].push({...tg,animDeg});
    });
  }

  return(
    <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gridTemplateRows:'repeat(4,1fr)',width:'100%',aspectRatio:'1',border:'1px solid rgba(232,184,75,0.2)',borderRadius:2,overflow:'hidden'}}>
      {SI_GRID.map((row,ri)=>row.map((signId,ci)=>{
        if(signId===null)return null;
        if(ri===1&&ci===1)return(
          <div key="center" style={{gridColumn:'2/4',gridRow:'2/4',border:'1px solid rgba(255,255,255,0.08)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'8px',gap:5,background:'rgba(13,10,30,0.9)'}}>
            <div style={{color:'var(--gold)',fontSize:10,fontFamily:'Space Mono',fontWeight:700}}>ॐ</div>
            <div style={{color:'var(--text1)',fontSize:11,fontWeight:700,textAlign:'center'}}>{CHART.name}</div>
            <div style={{color:'var(--text2)',fontSize:9,textAlign:'center',lineHeight:1.6}}>{CHART.dob}<br/>{CHART.tob}</div>
            <div style={{width:20,height:1,background:'rgba(232,184,75,0.3)'}}/>
            <div style={{color:'var(--teal)',fontSize:8,textAlign:'center'}}>Vrischika 14°20'</div>
          </div>
        );
        const sign=SIGNS.find(s=>s.id===signId);
        const planets=BY_SIGN[signId]||[];
        const transits=transitBySign[signId]||[];
        return(
          <div key={`${ri}-${ci}`} style={S(signId)}>
            <div style={{color:signId===8?'var(--gold)':'var(--text3)',fontSize:9,fontWeight:600,letterSpacing:'0.04em',lineHeight:1}}>{sign.sa.toUpperCase()}</div>
            <div style={{fontSize:8,color:'var(--text3)',marginBottom:1,fontFamily:'Space Mono'}}>{signId}</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:0}}>
              {planets.map(p=><GrahaChip key={p.id} g={p} small/>)}
              {transits.map(p=><GrahaChip key={'t'+p.id} g={p} small transit/>)}

/* ═══════════════ ANIMATED TRANSIT OVERLAY ═══════════════ */
function TransitOverlaySVG({offset,playing}){
  const cx=200,cy=200,r=155;
  const signs=SIGNS;
  const planets=TRANSIT_GRAHAS.map(tg=>{
    const deg=(tg.deg+offset*tg.speed*0.08)%360;
    const rad=(deg-90)*Math.PI/180;
    const d=0.55+((TRANSIT_GRAHAS.indexOf(tg)%3)*0.1);
    return{...tg,x:cx+Math.cos(rad)*r*d,y:cy+Math.sin(rad)*r*d,deg};
  });
  return(
    <svg viewBox="0 0 400 400" style={{width:'100%',height:'100%',position:'absolute',top:0,left:0,pointerEvents:'none'}}>
      <defs>
        <radialGradient id="tGlow"><stop offset="0%" stopColor="#00CDB0" stopOpacity=".15"/><stop offset="100%" stopColor="#00CDB0" stopOpacity="0"/></radialGradient>
      </defs>
      {/* zodiac ring */}
      {[.98,.82,.65].map((f,i)=>(
        <circle key={i} cx={cx} cy={cy} r={r*f} fill="none" stroke={i===0?"rgba(0,205,176,0.25)":"rgba(168,159,200,0.1)"} strokeWidth={i===0?1.2:.6} strokeDasharray={i>0?"4 6":undefined}/>
      ))}
      {signs.map((_,i)=>{
        const a=(i*30-90)*Math.PI/180;
        return <line key={i} x1={cx+Math.cos(a)*r*.65} y1={cy+Math.sin(a)*r*.65} x2={cx+Math.cos(a)*r*.98} y2={cy+Math.sin(a)*r*.98} stroke="rgba(100,90,160,0.12)" strokeWidth=".6"/>;
      })}
      {/* sign labels */}
      {signs.map((s,i)=>{
        const a=((i*30)+15-90)*Math.PI/180;
        const lx=cx+Math.cos(a)*r*.9,ly=cy+Math.sin(a)*r*.9;
        return <text key={s.id} x={lx} y={ly} textAnchor="middle" dominantBaseline="middle" fontSize="7" fill="rgba(168,159,200,0.4)" fontFamily="Space Grotesk">{s.sa.slice(0,3).toUpperCase()}</text>;
      })}
      {/* orbit trails */}
      {planets.map(p=>{
        const trail=Array.from({length:8},(_,i)=>{
          const d2=(p.deg-i*p.speed*0.5)%360;
          const r2=(d2-90)*Math.PI/180;
          const dist=0.55+((TRANSIT_GRAHAS.findIndex(t=>t.id===p.id)%3)*0.1);
          return `${cx+Math.cos(r2)*r*dist},${cy+Math.sin(r2)*r*dist}`;
        }).join(' ');
        return <polyline key={p.id+'t'} points={trail} fill="none" stroke={p.color} strokeWidth=".8" strokeOpacity=".3" strokeLinecap="round"/>;
      })}
      {/* planet dots */}
      {planets.map(p=>(
        <g key={p.id}>

      {/* center */}
      <circle cx={cx} cy={cy} r="6" fill="#00CDB0" opacity=".9"/>
      <circle cx={cx} cy={cy} r="3" fill="#00E5CC"/>
    </svg>
  );
}

/* ═══════════════ DASHA TIMELINE SCRUBBER ═══════════════ */
const TIMELINE_START=1985,TIMELINE_END=2075;
const TOTAL_YEARS=TIMELINE_END-TIMELINE_START;

function DashaTimeline({scrubYear,setScrubYear,playing,setPlaying}){
  const trackRef=useRef(null);
  const activeDasha=DASHAS.find(d=>scrubYear>=d.startY&&scrubYear<d.endY);
  const activeAntar=activeDasha?.antars?.find(a=>a.current||(a.done&&!a.current));

  const pct=((scrubYear-TIMELINE_START)/TOTAL_YEARS)*100;

  const seek=useCallback(e=>{
    const rect=trackRef.current?.getBoundingClientRect();
    if(!rect)return;
    const x=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
    setScrubYear(Math.round(TIMELINE_START+x*TOTAL_YEARS));
  },[setScrubYear]);

  const onMouseDown=e=>{
    seek(e);
    const up=()=>document.removeEventListener('mousemove',seek);
    document.addEventListener('mousemove',seek);
    document.addEventListener('mouseup',up,{once:true});
  };

  return(
    <div style={{display:'flex',flexDirection:'column',gap:8}}>
      {/* controls */}
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <button onClick={()=>setPlaying(p=>!p)} style={{width:30,height:30,borderRadius:'50%',background:playing?'var(--gold)':'var(--bg3)',border:`1px solid ${playing?'var(--gold)':'var(--sep2)'}`,color:playing?'#08061a':'var(--text1)',fontSize:12,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
          {playing?'⏸':'▶'}
        </button>
        <div style={{flex:1,position:'relative',height:36,display:'flex',alignItems:'center',cursor:'ew-resize'}} ref={trackRef} onMouseDown={onMouseDown}>
          {/* dasha bands */}
          <div style={{position:'absolute',inset:'8px 0',borderRadius:4,overflow:'hidden',background:'var(--bg3)'}}>
            {DASHAS.map(d=>{
              const left=((d.startY-TIMELINE_START)/TOTAL_YEARS)*100;
              const width=((d.endY-d.startY)/TOTAL_YEARS)*100;
              return(
                <div key={d.graha} title={d.graha} style={{position:'absolute',top:0,bottom:0,left:`${left}%`,width:`${width}%`,background:d.color+(d.current?'50':'28'),borderRight:'1px solid rgba(255,255,255,0.05)',transition:'background .2s'}}>
                  {width>4&&<span style={{position:'absolute',left:3,top:'50%',transform:'translateY(-50%)',color:d.color,fontSize:8,fontFamily:'Space Mono',fontWeight:700,opacity:.9}}>{d.graha}</span>}
                </div>
              );
            })}
            {/* shimmer for current */}
            {playing&&<div style={{position:'absolute',inset:0,background:'linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent)',animation:'shimmer 1.5s infinite',left:'-100%',width:'50%'}}/>}
          </div>
          {/* playhead */}
          <div style={{position:'absolute',left:`${pct}%`,top:0,bottom:0,width:2,background:'white',opacity:.9,borderRadius:1,transform:'translateX(-50%)',zIndex:2,pointerEvents:'none'}}/>
          <div style={{position:'absolute',left:`${pct}%`,top:'50%',transform:'translate(-50%,-50%)',width:14,height:14,borderRadius:'50%',background:'white',border:'2px solid var(--bg)',zIndex:3,pointerEvents:'none',boxShadow:'0 0 8px rgba(255,255,255,0.4)'}}/>
        </div>
        <div style={{color:'var(--gold)',fontSize:13,fontFamily:'Space Mono',fontWeight:700,minWidth:36,textAlign:'right'}}>{scrubYear}</div>
      </div>

      {/* active period display */}
      {activeDasha&&(
        <div style={{display:'flex',gap:8,animation:'fadeSlideUp .2s ease'}}>
          <div style={{flex:1,background:'var(--bg3)',borderRadius:8,padding:'8px 10px',border:`1px solid ${activeDasha.color}44`}}>
            <div style={{color:'var(--text3)',fontSize:9,textTransform:'uppercase',letterSpacing:'.07em',marginBottom:3}}>Mahadasha</div>
            <div style={{color:activeDasha.color,fontSize:13,fontWeight:700,fontFamily:'Space Mono'}}>{GRAHAS.find(g=>g.id===activeDasha.graha)?.sa||activeDasha.graha}</div>
            <div style={{color:'var(--text2)',fontSize:10,marginTop:2}}>{activeDasha.start} – {activeDasha.end}</div>
          </div>
          {/* antardasha mini-bars */}
          {activeDasha.antars&&(
            <div style={{flex:2,background:'var(--bg3)',borderRadius:8,padding:'8px 10px',border:'1px solid var(--sep)'}}>
              <div style={{color:'var(--text3)',fontSize:9,textTransform:'uppercase',letterSpacing:'.07em',marginBottom:5}}>Antardasha Sequence</div>
              <div style={{display:'flex',gap:2,height:14}}>
                {activeDasha.antars.map((a,i)=>{
                  const ag=GRAHAS.find(g=>g.id===a.g);
                  const activePct=((scrubYear-activeDasha.startY)/(activeDasha.endY-activeDasha.startY))*100;
                  // rough cumulative pct
                  const cumPct=activeDasha.antars.slice(0,i).reduce((s,x)=>s+x.pct,0);
                  const isActive=activePct>=cumPct&&activePct<cumPct+a.pct;
                  return(
                    <div key={a.g} title={a.g} style={{flex:a.pct,background:isActive?ag?.color||'var(--teal)':a.done?ag?.color+'33':'rgba(255,255,255,0.04)',borderRadius:3,position:'relative',transition:'background .3s'}}>
                      {a.pct>9&&<span style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',color:isActive?'#080616':ag?.color||'var(--text3)',fontSize:7,fontFamily:'Space Mono',fontWeight:700,opacity:isActive?1:.7}}>{a.g}</span>}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

                    {isActive&&<span style={{color:d.color,fontSize:9,fontWeight:700,background:d.color+'22',padding:'1px 6px',borderRadius:10,animation:'dashaPulse 2s infinite'}}>ACTIVE</span>}
                  </div>
                  <div style={{color:'var(--text2)',fontSize:11}}>{d.start} – {d.end} · {d.years}y</div>
                  {/* mini progress bar */}
                  {isActive&&(
                    <div style={{marginTop:5,height:3,background:'var(--bg3)',borderRadius:2,overflow:'hidden'}}>
                      <div style={{height:'100%',width:`${((scrubYear-d.startY)/(d.endY-d.startY))*100}%`,background:d.color,borderRadius:2,transition:'width .1s'}}/>
                    </div>
                  )}
                </div>
              </div>
              {isActive&&d.antars&&(
                <div style={{borderTop:'1px solid var(--sep)',padding:'8px 14px 10px'}}>
                  <div style={{display:'flex',gap:3,height:20,marginBottom:6}}>
                    {d.antars.map((a,i)=>{
                      const ag=GRAHAS.find(g=>g.id===a.g);
                      const cumPct=d.antars.slice(0,i).reduce((s,x)=>s+x.pct,0);
                      const localPct=((scrubYear-d.startY)/(d.endY-d.startY))*100;
                      const isAct=localPct>=cumPct&&localPct<cumPct+a.pct;
                      return(
                        <div key={a.g} title={`${a.g}: ${a.s}–${a.e}`} style={{flex:a.pct,background:isAct?ag?.color:a.done?ag?.color+'33':'rgba(255,255,255,0.04)',borderRadius:4,display:'flex',alignItems:'center',justifyContent:'center',position:'relative',transition:'background .3s'}}>
                          {a.pct>6&&<span style={{fontSize:8,fontFamily:'Space Mono',fontWeight:700,color:isAct?'#080616':ag?.color+'99'}}>{a.g}</span>}
                          {isAct&&<div style={{position:'absolute',inset:0,borderRadius:4,border:`1px solid ${ag?.color}`,animation:'dashaPulse 1.5s infinite'}}/>}
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ReportScreen({activeClient}){
  const [query,setQuery]=useState('');
  const [loading,setLoading]=useState(false);
  const [report,setReport]=useState(null);
  const [error,setError]=useState(null);
  const reportRef=useRef(null);

  const clientCtx=activeClient?`CLIENT CHART:\nName: ${activeClient.name}\nDOB: ${activeClient.dob}, ${activeClient.tob}\nCity: ${activeClient.city} (${activeClient.lat}, ${activeClient.lon})\nLagna: ${activeClient.lagna} | Active Dasha: ${activeClient.dasha}\nNotes: ${activeClient.notes||'None'}\n\n(Full planetary positions would be calculated from the Swiss Ephemeris engine at runtime.)`:CHART_CTX;

  const generate=async(q)=>{
    const fq=q||query;if(!fq.trim())return;
    setLoading(true);setReport(null);setError(null);
    try{
      const res=await window.claude.complete({messages:[{role:'user',content:`You are an expert Jyotish astrologer with deep knowledge of Brihat Parashara Hora Shastra, Jaimini Sutras, and Bhrigu Nadi. Speak with authority, warmth, and precision. Use Sanskrit terminology alongside English. Format with **bold headers**.\n\n${clientCtx}\n\nQUERY: ${fq}\n\nProvide a thorough scholarly Jyotish reading. Reference specific degrees, nakshatras, and yogas from the chart.`}]});
      setReport(res);
      setTimeout(()=>reportRef.current?.scrollIntoView({behavior:'smooth',block:'start'}),100);
    }catch(e){setError('Reading could not be generated. Please try again.');}
    setLoading(false);
  };

  return(
    <div style={{overflowY:'auto',flex:1,padding:'12px 14px 24px'}}>
      {/* active client banner */}
      {activeClient?(
        <div style={{marginBottom:14,background:'rgba(232,184,75,0.07)',border:'1px solid rgba(232,184,75,0.25)',borderRadius:12,padding:'10px 14px',display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:32,height:32,borderRadius:10,background:'rgba(232,184,75,0.15)',border:'1px solid rgba(232,184,75,0.3)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            <span style={{color:'var(--gold)',fontSize:14,fontWeight:700}}>{activeClient.name[0]}</span>
          </div>
          <div style={{flex:1}}>
            <div style={{color:'var(--gold)',fontSize:12,fontWeight:700}}>{activeClient.name}</div>
            <div style={{color:'var(--text2)',fontSize:10,fontFamily:'Space Mono'}}>{activeClient.dob} · {activeClient.tob} · {activeClient.city}</div>
          </div>
          <span style={{color:'var(--gold)',fontSize:9,fontWeight:700,background:'rgba(232,184,75,0.12)',padding:'2px 8px',borderRadius:10,letterSpacing:'.07em'}}>CLIENT</span>
        </div>
      ):(
        <div style={{marginBottom:14}}>
          <div style={{color:'var(--gold)',fontSize:11,textTransform:'uppercase',letterSpacing:'.1em',fontWeight:700,marginBottom:4}}>✦ AI Jyotish Reading Engine</div>
          <div style={{color:'var(--text2)',fontSize:12,lineHeight:1.5}}>Full chart context is loaded. Tap a preset or type a custom question.</div>
        </div>
      )}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:14}}>
        {PROMPT_PRESETS.map(p=>(
          <button key={p.label} onClick={()=>generate(p.q)} style={{background:'var(--bg2)',border:'1px solid var(--sep2)',borderRadius:10,padding:'10px 12px',cursor:'pointer',textAlign:'left',transition:'border-color .15s'}}>
            <div style={{color:'var(--gold)',fontSize:14,marginBottom:4}}>{p.icon}</div>
            <div style={{color:'var(--text1)',fontSize:12,fontWeight:600,lineHeight:1.3}}>{p.label}</div>
          </button>
        ))}
      </div>
      <div style={{background:'var(--bg2)',border:'1px solid var(--sep2)',borderRadius:12,overflow:'hidden',marginBottom:14}}>
        <textarea value={query} onChange={e=>setQuery(e.target.value)} placeholder="Ask a custom question about this chart…" rows={3} style={{width:'100%',background:'transparent',border:'none',outline:'none',color:'var(--text0)',fontSize:13,lineHeight:1.6,padding:'12px 14px',fontFamily:'Space Grotesk',resize:'none'}}/>
        <div style={{padding:'8px 12px',borderTop:'1px solid var(--sep)',display:'flex',justifyContent:'flex-end'}}>
          <button onClick={()=>generate()} disabled={!query.trim()||loading} style={{background:query.trim()&&!loading?'var(--gold)':'var(--bg3)',border:'none',borderRadius:8,padding:'8px 16px',cursor:query.trim()&&!loading?'pointer':'default',color:query.trim()&&!loading?'#0D0A1E':'var(--text3)',fontSize:12,fontWeight:700,fontFamily:'Space Grotesk',transition:'all .2s'}}>Generate Reading →</button>
        </div>
      </div>
      {loading&&(
        <div style={{display:'flex',alignItems:'center',gap:12,background:'var(--bg2)',borderRadius:12,padding:'20px 16px',border:'1px solid var(--sep)'}}>
          <div style={{width:24,height:24,borderRadius:'50%',border:'2px solid var(--gold)',borderTopColor:'transparent',animation:'spin .8s linear infinite'}}/>
          <div>
            <div style={{color:'var(--text1)',fontSize:13,fontWeight:600}}>Consulting the Grahas…</div>
            <div style={{color:'var(--text2)',fontSize:11,marginTop:2}}>Synthesizing planetary positions and dashas</div>
          </div>
        </div>
      )}
      {report&&(
        <div ref={reportRef} style={{background:'var(--bg2)',border:'1px solid rgba(232,184,75,0.2)',borderRadius:14,padding:'16px 16px 20px',animation:'fadeSlideUp .3s ease'}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12,paddingBottom:10,borderBottom:'1px solid var(--sep)'}}>
            <span style={{color:'var(--gold)',fontSize:14}}>✦</span>
            <span style={{color:'var(--gold)',fontSize:11,textTransform:'uppercase',letterSpacing:'.1em',fontWeight:700}}>Jyotish Reading</span>
          </div>
          <div style={{color:'var(--text1)',fontSize:14,lineHeight:1.8,fontFamily:'Crimson Pro'}}
            dangerouslySetInnerHTML={{__html:report.replace(/\*\*(.+?)\*\*/g,'<strong style="color:#F5F2FF;font-weight:600">$1</strong>').replace(/\n\n/g,'</p><p style="margin-bottom:10px">').replace(/\n/g,'<br/>').replace(/^/,'<p style="margin-bottom:10px">').replace(/$/,'</p>')}}
          />
        </div>
      )}
      {error&&<div style={{background:'rgba(232,80,80,0.08)',border:'1px solid rgba(232,80,80,0.2)',borderRadius:12,padding:'14px 16px'}}><div style={{color:'#E85050',fontSize:13}}>{error}</div></div>}
    </div>
  );
}

  const filteredCities=CITIES.filter(c=>c.name.toLowerCase().includes(citySearch.toLowerCase()));

  const openNew=()=>{
    setEditClient(null);

  const openEdit=(c)=>{

                <div style={{display:'flex',alignItems:'flex-start',gap:12}}>
                  {/* avatar */}

                    <span style={{color:avatarColor,fontSize:16,fontWeight:700}}>{c.avatar||c.name[0]}</span>

          <div style={{color:'var(--text2)',fontSize:14,fontWeight:600}}>No clients yet</div>
          <div style={{color:'var(--text3)',fontSize:12,textAlign:'center',maxWidth:220}}>Add your first client to begin generating Jyotish readings for them.</div>
          <button onClick={openNew} style={{marginTop:8,padding:'10px 20px',background:'var(--gold)',border:'none',borderRadius:10,color:'#08061a',fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'Space Grotesk'}}>+ Add First Client</button>
        </div>
      )}
    </div>
  );
}

/* ═══════════════ APP SHELL ═══════════════ */
const TABS=[{id:'chart',label:'Kundali',icon:'⊞'},{id:'grahas',label:'Grahas',icon:'◉'},{id:'dashas',label:'Dashas',icon:'◌'},{id:'report',label:'Reading',icon:'✦'},{id:'clients',label:'Clients',icon:'◈'}];

function AppShell({vp}){
  const [tab,setTab]=useState('chart');
  const [activeClientId,setActiveClientId]=useState(null);
  const activeClient=activeClientId?SAMPLE_CLIENTS.find(c=>c.id===activeClientId)||null:null;
  return(
    <div style={{width:'100%',height:'100%',display:'flex',flexDirection:'column',background:'var(--bg)',position:'relative',overflow:'hidden'}}>
      {/* header */}
      <header style={{flexShrink:0,background:'var(--bg1)',borderBottom:'1px solid var(--sep)',padding:'10px 14px 8px',display:'flex',alignItems:'center',gap:10,justifyContent:'space-between'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:32,height:32,borderRadius:'50%',background:'rgba(232,184,75,0.1)',border:'1.5px solid rgba(232,184,75,0.35)',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <span style={{color:'var(--gold)',fontSize:14}}>ॐ</span>
          </div>
          <div>
            <div style={{color:'var(--text0)',fontSize:14,fontWeight:700,lineHeight:1.2}}>{activeClient?activeClient.name:CHART.name}</div>
            <div style={{color:'var(--text2)',fontSize:10,fontFamily:'Space Mono'}}>{activeClient?`${activeClient.dob} · ${activeClient.tob} · ${activeClient.city}`:CHART.dob+' · '+CHART.tob+' · '+CHART.pob.split(',')[0]}</div>
            {activeClient&&<div style={{color:'var(--gold)',fontSize:9,fontWeight:700,letterSpacing:'.07em',marginTop:2}}>CLIENT MODE</div>}
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          {/* desktop inline nav */}
          {vp==='desktop'&&(
            <div style={{display:'flex',gap:2,background:'var(--bg3)',borderRadius:10,padding:3}}>
              {TABS.map(t=>(
                <button key={t.id} onClick={()=>setTab(t.id)} style={{display:'flex',alignItems:'center',gap:5,padding:'6px 14px',borderRadius:8,border:'none',cursor:'pointer',background:tab===t.id?'rgba(232,184,75,0.12)':'transparent',color:tab===t.id?'var(--gold)':'var(--text3)',fontSize:11,fontWeight:600,letterSpacing:'.05em',transition:'all .15s'}}>
                  <span style={{fontSize:13}}>{t.icon}</span>{t.label}
                </button>
              ))}
            </div>
          )}
          <div style={{background:'rgba(64,192,176,0.1)',border:'1px solid rgba(64,192,176,0.25)',borderRadius:20,padding:'3px 10px',display:'flex',alignItems:'center',gap:5}}>
            <div style={{width:5,height:5,borderRadius:'50%',background:'var(--teal)',boxShadow:'0 0 6px var(--teal)'}}/>
            <span style={{color:'var(--teal)',fontSize:10,fontWeight:600,fontFamily:'Space Mono'}}>LIVE</span>
          </div>
        </div>
      </header>

      {/* meta strip */}
      <div style={{flexShrink:0,background:'rgba(13,10,30,0.8)',borderBottom:'1px solid var(--sep)',padding:'5px 14px',display:'flex',gap:16,overflowX:'auto'}}>
        {[{l:'Ayanamsa',v:CHART.ayanamsa},{l:'Lat/Lng',v:`${CHART.lat} / ${CHART.lng}`},{l:'TZ',v:CHART.tz},{l:'Active Dasha',v:'Ke · Ve'}].map(({l,v})=>(
          <div key={l} style={{flexShrink:0,display:'flex',gap:5,alignItems:'baseline'}}>
            <span style={{color:'var(--text3)',fontSize:9,textTransform:'uppercase',letterSpacing:'.07em'}}>{l}</span>
            <span style={{color:'var(--teal)',fontSize:10,fontFamily:'Space Mono'}}>{v}</span>
          </div>
        ))}
      </div>

      {/* content */}
      <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column',paddingTop:4}}>
        {tab==='chart'  &&<ChartScreen vp={vp}/>}
        {tab==='grahas' &&<GrahasScreen/>}
        {tab==='dashas' &&<DashaScreen/>}
        {tab==='report' &&<ReportScreen activeClient={activeClient}/>}
        {tab==='clients'&&<ClientsScreen activeClientId={activeClientId} setActiveClientId={setActiveClientId} onOpenChart={()=>setTab('chart')}/>}
      </div>

      {/* bottom nav – mobile/tablet only */}
      {vp!=='desktop'&&(
        <nav style={{flexShrink:0,height:56,background:'rgba(13,10,30,0.98)',backdropFilter:'blur(12px)',borderTop:'1px solid var(--sep)',display:'flex',zIndex:50}}>
          {TABS.map(t=>{
            const active=tab===t.id;
            return(
              <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:3,background:'none',border:'none',cursor:'pointer',position:'relative'}}>
                {active&&<div style={{position:'absolute',top:0,left:'25%',right:'25%',height:2,background:'var(--gold)',borderRadius:'0 0 2px 2px'}}/>}
                <span style={{fontSize:15,color:active?'var(--gold)':'var(--text3)',transition:'color .15s'}}>{t.icon}</span>
                <span style={{fontSize:9,fontWeight:active?700:400,letterSpacing:'.06em',color:active?'var(--gold)':'var(--text3)',textTransform:'uppercase',transition:'color .15s'}}>{t.label}</span>
              </button>
            );
          })}
        </nav>
      )}
    </div>
  );
}

/* ═══════════════ ROOT ═══════════════ */
const VP_SIZES={mobile:{w:390,h:844},tablet:{w:768,h:'100%'},desktop:{w:'100%',h:'100%'}};
const VP_ICONS={
  mobile:<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><rect x="5" y="2" width="14" height="20" rx="2"/><circle cx="12" cy="18" r="1" fill="currentColor" stroke="none"/></svg>,
  tablet:<svg width="14" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>,
  desktop:<svg width="16" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>,
};

function Root(){
  const { TweaksPanel, useTweaks } = window;
  const [tweaks,setTweak]=useTweaks(/*EDITMODE-BEGIN*/{
    "viewport": "desktop",
    "accentColor": "#E8B84B"
  }/*EDITMODE-END*/);
  const [vp,setVp]=useState(tweaks.viewport);
  const stageRef=useRef(null);
  const [stageH,setStageH]=useState(900);

  useEffect(()=>{
    const obs=new ResizeObserver(([e])=>setStageH(e.contentRect.height));
    if(stageRef.current)obs.observe(stageRef.current);
    return()=>obs.disconnect();
  },[]);

  useEffect(()=>{document.documentElement.style.setProperty('--gold',tweaks.accentColor);},[tweaks.accentColor]);

  const frameStyle=useMemo(()=>{
    if(vp==='mobile') return {width:390,height:Math.min(844,stageH-20),borderRadius:40,border:'6px solid #15122a',marginTop:10,flexShrink:0};
    if(vp==='tablet') return {width:768,height:'100%',borderRadius:16,border:'3px solid #15122a',flexShrink:0};
    return {width:'100%',height:'100%',borderRadius:0,border:'none',flexShrink:0};
  },[vp,stageH]);

  return(
    <div style={{display:'flex',flexDirection:'column',width:'100%',height:'100%'}}>
      {/* viewport chrome bar */}
      <div className="vp-bar">
        <span style={{color:'var(--text3)',fontSize:10,fontFamily:'Space Grotesk',fontWeight:600,marginRight:6,letterSpacing:'.05em'}}>VIEWPORT</span>
        <div className="vp-divider"/>
        {['mobile','tablet','desktop'].map(v=>(
          <button key={v} className={`vp-btn${vp===v?' active':''}`} onClick={()=>{setVp(v);setTweak('viewport',v);}}>
            {VP_ICONS[v]}{v.charAt(0).toUpperCase()+v.slice(1)}
            {v==='mobile'&&<span style={{fontSize:9,opacity:.6,marginLeft:2}}>390px</span>}
            {v==='tablet'&&<span style={{fontSize:9,opacity:.6,marginLeft:2}}>768px</span>}
          </button>
        ))}
        <div className="vp-divider"/>
        <span style={{color:'var(--text3)',fontSize:10,fontFamily:'Space Mono'}}>
          {vp==='mobile'?'390×844':vp==='tablet'?'768px':'Full'}
        </span>
      </div>

      {/* stage */}
      <div className="vp-stage" ref={stageRef} style={{alignItems:vp==='mobile'?'flex-start':'stretch'}}>
        <div style={{...frameStyle,background:'var(--bg)',overflow:'hidden',boxShadow:vp!=='desktop'?'0 32px 100px rgba(0,0,0,.8)':'none',display:'flex',flexDirection:'column',transition:'width .4s cubic-bezier(.32,.72,0,1),border-radius .4s cubic-bezier(.32,.72,0,1)'}}>
          <AppShell vp={vp}/>
        </div>
      </div>

      {TweaksPanel&&(
        <TweaksPanel>
          <window.TweakSection label="Viewport">
            <window.TweakRadio id="viewport" label="Default Viewport" value={tweaks.viewport} options={['mobile','tablet','desktop']} onChange={v=>{setTweak('viewport',v);setVp(v);}}/>
          </window.TweakSection>
          <window.TweakSection label="Appearance">
            <window.TweakColor id="accentColor" label="Accent Color" value={tweaks.accentColor} onChange={v=>setTweak('accentColor',v)}/>
          </window.TweakSection>
        </TweaksPanel>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
