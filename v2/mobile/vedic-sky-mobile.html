<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Vedic SkyObserver</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}

:root{
  --bg:#060511;
  --surface:#0d0b20;
  --s2:#161235;
  --s3:#1e194a;
  --fg:#e8dcff;
  --muted:#675890;
  --border:#201945;
  --gold:#d4a020;
  --gold-dim:#7a5c12;
  --orange:#e85d04;
  --teal:#00b89c;
  --nav-h:60px;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;
  background:var(--bg);
  color:var(--fg);
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ── HEADER ── */
.header{
  height:56px;
  display:flex;align-items:center;gap:10px;
  padding:0 14px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  z-index:5;
}
.logo{display:flex;align-items:center;gap:9px;flex-shrink:0}
.logo-icon{
  width:34px;height:34px;border-radius:50%;
  border:1.5px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  color:var(--gold);
}
.logo-text{display:flex;flex-direction:column}
.logo-name{font-size:11.5px;font-weight:700;color:var(--gold);letter-spacing:.13em;line-height:1.2}
.logo-sub{font-size:7px;color:var(--muted);letter-spacing:.14em;line-height:1}
.mode-wrap{flex:1;display:flex;justify-content:center}
.mode-pills{
  display:flex;gap:2px;
  background:var(--s2);border:1px solid var(--border);
  border-radius:8px;padding:3px;
}
.mode-pill{
  display:flex;align-items:center;gap:5px;
  padding:5px 13px;border-radius:5px;
  font-size:10.5px;font-weight:700;letter-spacing:.07em;
  color:var(--muted);background:transparent;border:none;cursor:pointer;
  transition:background .15s,color .15s;white-space:nowrap;
}
.mode-pill.active{background:var(--orange);color:#fff}
.hdr-end{display:flex;align-items:center;gap:6px}
.ic-btn{
  width:38px;height:38px;border-radius:50%;
  background:var(--s2);border:1px solid var(--border);
  color:var(--muted);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.ic-btn.gold{color:var(--gold)}
.avatar{
  width:32px;height:32px;border-radius:50%;
  background:var(--gold-dim);border:1.5px solid var(--gold);
  color:var(--gold);font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}

/* ── CONTROLS BAR ── */
.ctrl-bar{
  height:44px;
  display:flex;align-items:center;gap:8px;
  padding:0 12px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.type-tabs{display:flex;flex:1;gap:3px}
.type-tab{
  flex:1;padding:6px 8px;border-radius:6px;
  font-size:10px;font-weight:600;letter-spacing:.06em;
  border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.type-tab.active{background:var(--s2);border-color:var(--gold-dim);color:var(--gold)}
.ctrl-sep{width:1px;height:20px;background:var(--border);flex-shrink:0}
.zoom-grp{display:flex;gap:3px}
.z-btn{
  width:36px;height:36px;border-radius:6px;
  background:var(--s2);border:1px solid var(--border);
  color:var(--muted);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .1s;
}
.z-btn:active{background:var(--border)}

/* ── CHART AREA ── */
.chart-area{
  flex:1;position:relative;
  overflow:hidden;background:var(--bg);
  min-height:0;
}
#chart-svg{width:100%;height:100%;display:block}

/* Inspect hint */
.hint{
  position:absolute;top:10px;left:14px;right:14px;height:38px;
  background:rgba(13,11,32,.9);
  backdrop-filter:blur(8px) saturate(1.5);
  -webkit-backdrop-filter:blur(8px) saturate(1.5);
  border:1px solid var(--border);border-radius:10px;
  display:flex;align-items:center;gap:10px;
  padding:0 12px;
  font-size:11px;color:var(--muted);letter-spacing:.06em;
  pointer-events:none;
  transition:opacity .3s;
}
.hint-box{
  width:12px;height:12px;border-radius:3px;
  background:var(--s2);border:1px solid var(--border);
  flex-shrink:0;
}

/* ── LEGEND ── */
.legend{
  height:auto;min-height:28px;
  display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;
  padding:5px 12px;
  background:var(--surface);
  border-top:1px solid var(--border);
  flex-shrink:0;
}
.leg-item{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.leg-ring{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted);flex-shrink:0}

/* ── BOTTOM NAV ── */
.bottom-nav{
  height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--surface);
  border-top:1px solid var(--border);
  display:flex;align-items:stretch;
  flex-shrink:0;
  position:relative;z-index:5;
}
.nav-item{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:3px;
  background:none;border:none;
  color:var(--muted);cursor:pointer;
  transition:color .15s;padding:5px 2px;
  min-width:0;
}
.nav-item.active{color:var(--gold)}
.nav-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.nav-label{font-size:9.5px;font-weight:700;letter-spacing:.06em;white-space:nowrap}

/* ── FIXED OVERLAYS ── */
.fab{
  position:fixed;right:16px;
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);
  width:50px;height:50px;border-radius:50%;
  background:var(--gold);color:var(--bg);
  border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  box-shadow:0 4px 20px rgba(212,160,32,.45);
  z-index:15;transition:transform .1s,box-shadow .1s;
}
.fab:active{transform:scale(.94);box-shadow:0 2px 10px rgba(212,160,32,.3)}

.backdrop{
  position:fixed;inset:0;
  background:rgba(0,0,0,0);
  pointer-events:none;
  transition:background .25s;
  z-index:20;
}
.backdrop.on{background:rgba(0,0,0,.65);pointer-events:all}

.sheet{
  position:fixed;left:0;right:0;bottom:0;
  background:var(--surface);
  border-radius:20px 20px 0 0;
  border-top:1px solid var(--border);
  transform:translateY(100%);
  transition:transform .3s cubic-bezier(.32,.72,0,1);
  z-index:25;
  padding-bottom:max(16px,env(safe-area-inset-bottom));
}
.sheet.open{transform:translateY(0)}
.sheet-knob{display:flex;justify-content:center;padding:12px 0 6px}
.sheet-knob::after{content:'';width:36px;height:4px;background:var(--border);border-radius:2px}
.sheet-head{display:flex;align-items:center;gap:14px;padding:4px 20px 16px}
.planet-badge{
  width:46px;height:46px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:#fff;flex-shrink:0;
}
.p-info h3{font-size:17px;font-weight:600;color:var(--fg);margin-bottom:2px}
.p-info p{font-size:12px;color:var(--muted)}
.data-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:1px;background:var(--border);
  margin:0 20px 4px;border-radius:12px;overflow:hidden;
}
.dcell{background:var(--s2);padding:12px 14px}
.clabel{font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.cval{font-size:15px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.csub{font-size:11px;color:var(--muted);margin-top:2px}
</style>
<style>
@media (max-width: 360px) {
  .logo-sub { display: none; }

}

    var panel = panelEl();

    suppressEcho = true;
    document.documentElement.toggleAttribute('data-od-tweaks-hidden', !visible);

    // change so we don't echo our own host-driven toggles back to the host.

      parent.postMessage({
        type: 'od:tweaks-panel-state',
        visible: !panel.classList.contains('tw-hidden'),

    } catch (e) {}

    try {
      parent.postMessage({
        type: 'od:tweaks-available',
        available: !!panelEl(),

    } catch (e) {}

    var panel = panelEl();

    // attribute. The bridge sets data-od-tweaks-hidden synchronously in head

    // classes, and posted state from that captured value so a default

    var initialVisible = !!panel && !panel.classList.contains('tw-hidden');

      <h3 id="sh-name" data-od-id="path-7-1-1-0">Venus</h3>

      <div class="cval" id="dc-house" data-od-id="path-7-2-1-1">9th</div>

      <div class="cval" id="dc-dign" data-od-id="path-7-2-2-1">Debilitated</div>
      <div class="csub" id="dc-dsub" data-od-id="path-7-2-2-2">Enemy sign</div>
    </div>
    <div class="dcell">
      <div class="clabel">NAKSHATRA</div>
      <div class="cval" id="dc-naks" data-od-id="path-7-2-3-1">Ashwini</div>
      <div class="csub" id="dc-nsub" data-od-id="path-7-2-3-2">Ketu · Pada 3</div>
    </div>
  </div>

<script>
// ── CONSTANTS ──
const CX = 195, CY = 218;
const ARIES_DEG = 152; // clockwise from 12 o'clock

// Ring radii
const R = {
  outerBg: 175,
  nakOut:  172,
  nakIn:   154,
  zodOut:  154,
  zodIn:   137,
  r1:      120,
  r2:      100,
  r3:       80,
  r4:       60,
  center:    8
};

// ── PLANET DATA ──
const PLANETS = [
  { sym:'☉', name:'Sun',     sub:'Surya',                    col:'#f0c040', a:165, r:83,
    d:{pos:"12°18'", sign:'Aries · Ashwini',       house:'9th', hname:'Dharma Bhava',   dign:'Exalted',     dsub:'Exaltation sign',     naks:'Ashwini',        nsub:'Ketu · Pada 3'} },
  { sym:'☽', name:'Moon',    sub:'Chandra',                  col:'#d0cce8', a:156, r:68,
    d:{pos:"08°22'", sign:'Aries · Ashwini',       house:'9th', hname:'Dharma Bhava',   dign:'Exalted',     dsub:'Strong in Aries',     naks:'Ashwini',        nsub:'Ketu · Pada 2'} },
  { sym:'♂', name:'Mars',    sub:'Mangala',                  col:'#e85000', a:183, r:58,
    d:{pos:"18°05'", sign:'Aries · Bharani',       house:'9th', hname:'Dharma Bhava',   dign:'Own sign',    dsub:'Very strong',         naks:'Bharani',        nsub:'Venus · Pada 1'} },
  { sym:'♀', name:'Venus',   sub:'Shukra · Retrograde ℞',   col:'#e040a0', a:176, r:73, retro:true,
    d:{pos:"14°52'", sign:'Aries · Ashwini',       house:'9th', hname:'Dharma Bhava',   dign:'Debilitated', dsub:'Enemy sign',          naks:'Ashwini',        nsub:'Ketu · Pada 3'} },
  { sym:'☿', name:'Mercury', sub:'Budha · Retrograde ℞',    col:'#7ab0d0', a:307, r:74, retro:true,
    d:{pos:"27°33'", sign:'Leo · Purva Phalguni',  house:'1st', hname:'Tanu Bhava',     dign:'Combust',     dsub:'Very close to Sun',   naks:'Purva Phalguni', nsub:'Venus · Pada 4'} },
  { sym:'♃', name:'Jupiter', sub:'Guru',                     col:'#dba010', a:77,  r:91,
    d:{pos:"16°41'", sign:'Aquarius · Shatabhisha',house:'7th', hname:'Kalatra Bhava',  dign:'Neutral',     dsub:'Neutral sign',        naks:'Shatabhisha',    nsub:'Rahu · Pada 1'} },
  { sym:'♄', name:'Saturn',  sub:'Shani · Retrograde ℞',    col:'#909090', a:292, r:96, retro:true,
    d:{pos:"03°14'", sign:'Virgo · Hasta',         house:'2nd', hname:'Dhana Bhava',    dign:'Neutral',     dsub:'Friendly sign',       naks:'Hasta',          nsub:'Moon · Pada 2'} },
  { sym:'☊', name:'Rahu',    sub:'North Node · Retrograde ℞',col:'#8040b0',a:193, r:87, retro:true,
    d:{pos:"21°44'", sign:'Aries · Bharani',       house:'9th', hname:'Dharma Bhava',   dign:'Neutral',     dsub:'Neutral placement',   naks:'Bharani',        nsub:'Venus · Pada 3'} },
];

const ZODIAC = ['ARI','TAU','GEM','CAN','LEO','VIR','LIB','SCO','SAG','CAP','AQU','PIS'];
const NAKS   = ['ASW','BHA','KRI','ROH','MRI','ARD','PUN','PUS','ASL','MAG','PPH','UPH','HAS','CHI','SWT','VIS','ANU','JYE','MOL','PAS','UAS','SRA','DHA','SAT','PBH','UBH','REV'];

// ── SVG HELPERS ──
const NS = 'http://www.w3.org/2000/svg';
function mkEl(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}

function polar(deg, radius) {
  const rad = (deg - 90) * Math.PI / 180;
  return { x: CX + radius * Math.cos(rad), y: CY + radius * Math.sin(rad) };
}

function arc(fromDeg, toDeg, r) {
  const a = polar(fromDeg, r), b = polar(toDeg, r);
  const large = (toDeg - fromDeg) > 180 ? 1 : 0;
  return `M ${a.x} ${a.y} A ${r} ${r} 0 ${large} 1 ${b.x} ${b.y}`;
}

// ── DRAW STARS ──
function drawStars() {
  const g = document.getElementById('lyr-stars');
  for (let i = 0; i < 140; i++) {
    const a   = Math.random() * 360;
    const rr  = Math.sqrt(Math.random()) * R.outerBg;
    const p   = polar(a + 90, rr);
    const sz  = Math.random() * 1.4 + 0.25;
    const op  = Math.random() * 0.55 + 0.12;
    g.appendChild(mkEl('circle', { cx:p.x, cy:p.y, r:sz, fill:'white', opacity:op }));
  }
}

// ── DRAW CHART STRUCTURE ──
function drawChart() {
  const g = document.getElementById('lyr-chart');

  // Background glow disc
  g.appendChild(mkEl('circle', { cx:CX, cy:CY, r:R.nakOut, fill:'url(#chartGlow)' }));

  // Outer boundary
  g.appendChild(mkEl('circle', { cx:CX, cy:CY, r:R.nakOut, fill:'none', stroke:'rgba(255,255,255,0.08)', 'stroke-width':1 }));

  // 12 house spokes — from center out to nakshatra ring
  for (let i = 0; i < 12; i++) {
    const a  = ARIES_DEG + i * 30;
    const p1 = polar(a, R.center + 2);
    const p2 = polar(a, R.nakOut);
    g.appendChild(mkEl('line', { x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y,
      stroke:'rgba(255,255,255,0.12)', 'stroke-width':0.8 }));
  }

  // 27 nakshatra sub-spokes in outer ring
  for (let i = 0; i < 27; i++) {
    const a  = ARIES_DEG + i * (360 / 27);
    const p1 = polar(a, R.nakIn);
    const p2 = polar(a, R.nakOut);
    g.appendChild(mkEl('line', { x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y,
      stroke:'rgba(255,255,255,0.07)', 'stroke-width':0.6 }));
  }

  // Aries sector highlight (most planets here)
  {
    const aS = ARIES_DEG, aE = ARIES_DEG + 30;
    const r1 = R.zodIn, r2 = R.zodOut;
    const p1 = polar(aS, r1), p2 = polar(aS, r2);
    const p3 = polar(aE, r2), p4 = polar(aE, r1);
    g.appendChild(mkEl('path', {
      d:`M ${p1.x} ${p1.y} L ${p2.x} ${p2.y} A ${r2} ${r2} 0 0 1 ${p3.x} ${p3.y} L ${p4.x} ${p4.y} A ${r1} ${r1} 0 0 0 ${p1.x} ${p1.y} Z`,
      fill:'rgba(232,93,4,0.1)', stroke:'none'
    }));
  }

  // Concentric rings
  const rings = [
    { r:R.nakOut, stroke:'rgba(255,255,255,0.14)', w:0.8 },
    { r:R.nakIn,  stroke:'rgba(255,255,255,0.20)', w:1.0 },
    { r:R.zodIn,  stroke:'rgba(255,255,255,0.14)', w:0.8 },
    { r:R.r1,     stroke:'rgba(0,184,156,0.40)',   w:1.2 },
    { r:R.r2,     stroke:'rgba(0,184,156,0.28)',   w:1.0 },
    { r:R.r3,     stroke:'rgba(120,60,220,0.22)',  w:0.8 },
    { r:R.r4,     stroke:'rgba(255,255,255,0.10)', w:0.7 },
    { r:R.center, stroke:'rgba(255,255,255,0.28)', w:1.0 },
  ];
  for (const { r, stroke, w } of rings) {
    g.appendChild(mkEl('circle', { cx:CX, cy:CY, r, fill:'none', stroke, 'stroke-width':w }));
  }

  // Nakshatra labels (27)
  const nakSpan = 360 / 27;
  for (let i = 0; i < 27; i++) {
    const mid = ARIES_DEG + (i + 0.5) * nakSpan;
    const lr  = (R.nakOut + R.nakIn) / 2 + 1;
    const p   = polar(mid, lr);
    // Rotate so text reads outward: tangent = mid, flip left half
    const rot = mid > 180 ? mid - 180 : mid;
    g.appendChild(mkEl('text', {
      x:p.x, y:p.y,
      transform:`rotate(${rot},${p.x},${p.y})`,
      'text-anchor':'middle', 'dominant-baseline':'middle',
      'font-size':6.5, fill:'rgba(255,255,255,0.35)',
      'font-family':'ui-monospace,monospace',
      'letter-spacing':'0.04em'
    }, NAKS[i]));
  }

  // Zodiac sign labels (12)
  for (let i = 0; i < 12; i++) {
    const mid = ARIES_DEG + (i + 0.5) * 30;
    const lr  = (R.zodOut + R.zodIn) / 2;
    const p   = polar(mid, lr);
    g.appendChild(mkEl('text', {
      x:p.x, y:p.y,
      'text-anchor':'middle', 'dominant-baseline':'middle',
      'font-size':9.5, fill:'rgba(255,255,255,0.50)',
      'font-weight':500,
    }, ZODIAC[i]));
  }
}

// ── DRAW PLANETS ──
function drawPlanets() {
  const g = document.getElementById('lyr-planets');

  // Earth (center)
  g.appendChild(mkEl('circle', { cx:CX, cy:CY, r:13, fill:'rgba(68,153,238,0.15)' }));
  g.appendChild(mkEl('line', { x1:CX-12, y1:CY, x2:CX+12, y2:CY, stroke:'rgba(68,153,238,0.4)', 'stroke-width':0.8 }));
  g.appendChild(mkEl('line', { x1:CX, y1:CY-12, x2:CX, y2:CY+12, stroke:'rgba(68,153,238,0.4)', 'stroke-width':0.8 }));
  g.appendChild(mkEl('circle', { cx:CX, cy:CY, r:7, fill:'#4499ee', filter:'url(#glow-md)' }));

  // ASC marker
  const asc = polar(272, 118);
  g.appendChild(mkEl('circle', { cx:asc.x, cy:asc.y, r:17, fill:'#00c090', filter:'url(#glow-sm)' }));
  g.appendChild(mkEl('text', {
    x:asc.x, y:asc.y,
    'text-anchor':'middle', 'dominant-baseline':'middle',
    'font-size':8, 'font-weight':700, fill:'white', 'pointer-events':'none'
  }, 'ASC'));

  // Planet bodies
  const PR = 10; // planet radius
  PLANETS.forEach(p => {
    const pos = polar(p.a, p.r);
    const grp = mkEl('g', { cursor:'pointer', role:'button', 'aria-label':p.name });

    // Halo glow
    grp.appendChild(mkEl('circle', { cx:pos.x, cy:pos.y, r:PR + 4, fill:`${p.col}28` }));
    // Main badge
    grp.appendChild(mkEl('circle', { cx:pos.x, cy:pos.y, r:PR, fill:p.col, filter:'url(#glow-xs)' }));
    // Symbol
    grp.appendChild(mkEl('text', {
      x:pos.x, y:pos.y + 0.5,
      'text-anchor':'middle', 'dominant-baseline':'middle',
      'font-size':12, fill:'white', 'font-weight':600,
      'pointer-events':'none'
    }, p.sym));

    // Retrograde badge
    if (p.retro) {
      const bx = pos.x + PR - 1, by = pos.y - PR + 1;
      grp.appendChild(mkEl('circle', { cx:bx, cy:by, r:5.5, fill:'#e85d04' }));
      grp.appendChild(mkEl('text', {
        x:bx, y:by + 0.5,
        'text-anchor':'middle', 'dominant-baseline':'middle',
        'font-size':6.5, fill:'white', 'font-weight':700, 'pointer-events':'none'
      }, 'R'));
    }

    grp.addEventListener('click', e => { e.stopPropagation(); openSheet(p); });
    g.appendChild(grp);
  });
}

// ── ZOOM ──
let zoom = 1;
function applyZoom() {
  const tx = CX * (1 - zoom);
  const ty = CY * (1 - zoom);
  const tf = `translate(${tx} ${ty}) scale(${zoom})`;
  ['lyr-stars','lyr-chart','lyr-planets'].forEach(id =>
    document.getElementById(id).setAttribute('transform', tf));
}
function doZoom(f) { zoom = Math.max(0.45, Math.min(4, zoom * f)); applyZoom(); }
function doReset() { zoom = 1; applyZoom(); }

// ── SHEET ──
function openSheet(p) {
  document.getElementById('sh-badge').textContent = p.sym;
  document.getElementById('sh-badge').style.background = p.col;
  document.getElementById('sh-name').textContent = p.name;
  document.getElementById('sh-sub').textContent = p.sub;
  document.getElementById('dc-pos').textContent   = p.d.pos;
  document.getElementById('dc-sign').textContent  = p.d.sign;
  document.getElementById('dc-house').textContent = p.d.house;
  document.getElementById('dc-hname').textContent = p.d.hname;
  document.getElementById('dc-dign').textContent  = p.d.dign;
  document.getElementById('dc-dsub').textContent  = p.d.dsub;
  document.getElementById('dc-naks').textContent  = p.d.naks;
  document.getElementById('dc-nsub').textContent  = p.d.nsub;
  document.getElementById('sheet').classList.add('open');
  document.getElementById('backdrop').classList.add('on');
  document.getElementById('hint').style.opacity = '0';
}
function closeSheet() {
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('backdrop').classList.remove('on');
  document.getElementById('hint').style.opacity = '1';
}

// ── NAV / MODE / TYPE ──
function setMode(btn) {
  document.querySelectorAll('.mode-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
function setType(btn) {
  document.querySelectorAll('.type-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
function setNav(btn) {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ── INIT ──
window.addEventListener('DOMContentLoaded', () => {
  drawStars();
  drawChart();
  drawPlanets();
});
</script>
